apiVersion: apps/v1
kind: Deployment
metadata:
  name: credibility-predictor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credibility-predictor
  template:
    metadata:
      labels:
        app: credibility-predictor
    spec:
      containers:
      - name: credibility-predictor
        image: credibility-predictor:latest
        ports:
        - containerPort: 4000
        env:
        - name: FLASK_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: credibility-predictor-service
spec:
  selector:
    app: credibility-predictor
  ports:
  - port: 4000
    targetPort: 4000
  type: ClusterIP