apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamil-classifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tamil-classifier
  template:
    metadata:
      labels:
        app: tamil-classifier
    spec:
      containers:
      - name: tamil-classifier
        image: tamil-classifier:latest
        ports:
        - containerPort: 1000
        env:
        - name: FLASK_ENV
          value: "production"
        - name: FLASK_HOST
          value: "0.0.0.0"
        - name: FLASK_PORT
          value: "1000"
        - name: USE_CUDA
          value: "false"
        - name: LOG_LEVEL
          value: "INFO"
        livenessProbe:
          httpGet:
            path: /health
            port: 1000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 1000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tamil-classifier-service
spec:
  selector:
    app: tamil-classifier
  ports:
  - port: 1000
    targetPort: 1000
  type: ClusterIP