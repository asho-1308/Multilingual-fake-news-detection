<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fake News Detector</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <span class="badge">AI</span>
        <h3>Fake News Detector</h3>
      </div>
      
      <button id="scanBtn">Scan for Headlines</button>
      
      <div id="status">Ready to scan current page</div>

      <div id="results">
        <p id="summary">No headings detected yet.</p>
        <ul id="headingsList"></ul>
      </div>

      <div class="note">
        Backend: <code>localhost:5000</code>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
