services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ORCHESTRATOR_URL: ${VITE_ORCHESTRATOR_URL:-http://127.0.0.1:5000}
        VITE_TAMIL_URL: ${VITE_TAMIL_URL:-http://127.0.0.1:1000}
        VITE_SINHALA_URL: ${VITE_SINHALA_URL:-http://127.0.0.1:2000}
        VITE_SIMILARITY_URL: ${VITE_SIMILARITY_URL:-http://127.0.0.1:3000}
        VITE_CREDIBILITY_URL: ${VITE_CREDIBILITY_URL:-http://127.0.0.1:4000}
    container_name: frontend-service
    ports:
      - "8080:80"
    depends_on:
      - orchestrator
    restart: unless-stopped
    networks:
      - fake-news-detection
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tamil-classifier:
    build:
      context: ./backend/tamil_classifier
      dockerfile: Dockerfile
    container_name: tamil-classifier-service
    ports:
      - "1000:1000"
    environment:
      - FLASK_ENV=production
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=1000
      - USE_CUDA=false  # Set to true if GPU available
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/tamil_classifier/final_trained_model:/app/final_trained_model
      - ./backend/tamil_classifier/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fake-news-detection
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sinhala-classifier:
    build:
      context: ./backend/sinhala_classifier
      dockerfile: Dockerfile
    container_name: sinhala-classifier-service
    ports:
      - "2000:2000"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fake-news-detection
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  similarity-matcher:
    build:
      context: ./backend/similarity_matcher
      dockerfile: Dockerfile
    container_name: similarity-matcher-service
    ports:
      - "3000:3000"
    environment:
      - FLASK_ENV=production
    volumes:
      - ./backend/similarity_matcher/artifacts:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fake-news-detection
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  credibility-predictor:
    build:
      context: ./backend/credibility_predictor
      dockerfile: Dockerfile
    container_name: credibility-predictor-service
    ports:
      - "4000:4000"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fake-news-detection
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  orchestrator:
    build:
      context: ./backend/orchestrator
      dockerfile: Dockerfile
    container_name: orchestrator-service
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - TAMIL_CLASSIFIER_URL=http://tamil-classifier:1000
      - SINHALA_CLASSIFIER_URL=http://sinhala-classifier:2000
      - SIMILARITY_MATCHER_URL=http://similarity-matcher:3000
      - CREDIBILITY_PREDICTOR_URL=http://credibility-predictor:4000
    depends_on:
      - tamil-classifier
      - sinhala-classifier
      - similarity-matcher
      - credibility-predictor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fake-news-detection
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fake-news-detection:
    driver: bridge
